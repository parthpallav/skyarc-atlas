# Production: API + self-hosted PostGIS on the same VPS (no external DB).
#
# Internal container ports stay fixed (docker DNS: api:3001, orbit-cloud:3002).
# Publish to the host via API_HOST_PORT / ORBIT_HOST_PORT — open those on the
# firewall when you add a module. Do not hardcode VPS hostnames in app config;
# the web app proxies via API_PROXY_TARGET at runtime.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skyarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skyarc_atlas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-skyarc} -d ${POSTGRES_DB:-skyarc_atlas}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_HOST_PORT:-3001}:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_BOOTSTRAP: ${DATABASE_BOOTSTRAP:-auto}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AI_MODEL: ${AI_MODEL:-openrouter/free}
      PORT: 3001
      NODE_ENV: production
      ADTECH_BOOKING: ${ADTECH_BOOKING:-true}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WEB_APP_URL: ${WEB_APP_URL:-https://atlas.skyarcads.com}
      ORBIT_CLOUD_URL: ${ORBIT_CLOUD_URL:-http://orbit-cloud:3002}
      ORBIT_SERVICE_TOKEN: ${ORBIT_SERVICE_TOKEN:-}
      ORBIT_WEBHOOK_SECRET: ${ORBIT_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  orbit-cloud:
    build:
      context: .
      dockerfile: services/orbit-cloud/Dockerfile
    ports:
      - "${ORBIT_HOST_PORT:-3002}:3002"
    environment:
      ORBIT_DATABASE_URL: ${ORBIT_DATABASE_URL:?Set ORBIT_DATABASE_URL in .env}
      ORBIT_SERVICE_TOKEN: ${ORBIT_SERVICE_TOKEN:?Set ORBIT_SERVICE_TOKEN in .env}
      ORBIT_WEBHOOK_SECRET: ${ORBIT_WEBHOOK_SECRET:?Set ORBIT_WEBHOOK_SECRET in .env}
      ATLAS_INTERNAL_URL: ${ATLAS_INTERNAL_URL:-http://api:3001}
      ORBIT_PORT: 3002
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  bridge:
    build:
      context: .
      dockerfile: services/bridge/Dockerfile
    ports:
      - "${BRIDGE_HOST_PORT:-3004}:3004"
    environment:
      BRIDGE_DATABASE_URL: ${BRIDGE_DATABASE_URL:?Set BRIDGE_DATABASE_URL in .env}
      BRIDGE_SERVICE_TOKEN: ${BRIDGE_SERVICE_TOKEN:?Set BRIDGE_SERVICE_TOKEN in .env}
      BRIDGE_PORT: 3004
      NODE_ENV: production
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pulse:
    build:
      context: .
      dockerfile: services/pulse/Dockerfile
    ports:
      - "${PULSE_HOST_PORT:-3003}:3003"
    environment:
      PULSE_DATABASE_URL: ${PULSE_DATABASE_URL:?Set PULSE_DATABASE_URL in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      BRIDGE_SERVICE_TOKEN: ${BRIDGE_SERVICE_TOKEN}
      BRIDGE_INTERNAL_URL: ${BRIDGE_INTERNAL_URL:-http://bridge:3004}
      ATLAS_INTERNAL_URL: ${ATLAS_INTERNAL_URL:-http://api:3001}
      WEB_APP_URL: ${WEB_APP_URL:-https://atlas.skyarcads.com}
      PULSE_PORT: 3003
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      bridge:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
