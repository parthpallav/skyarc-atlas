# Example nginx site for staging API + Orbit (Pulse/Bridge usually reached via Vercel proxy only).
# Replace YOUR_STAGING_API_HOST and TLS cert paths.

upstream atlas_api_staging {
  server 127.0.0.1:3101;
  keepalive 32;
}

upstream orbit_staging {
  server 127.0.0.1:3102;
  keepalive 8;
}

server {
  listen 443 ssl http2;
  server_name api-staging.example.com;

  ssl_certificate     /etc/letsencrypt/live/api-staging.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api-staging.example.com/privkey.pem;

  client_max_body_size 55m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    proxy_pass http://atlas_api_staging;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name orbit-staging.example.com;

  ssl_certificate     /etc/letsencrypt/live/orbit-staging.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/orbit-staging.example.com/privkey.pem;

  location / {
    proxy_pass http://orbit_staging;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Pulse (optional direct host — prefer Vercel PULSE_PROXY_TARGET to 127.0.0.1:3103 over SSH tunnel or private link)
# server { ... server_name pulse-staging.example.com; proxy_pass http://127.0.0.1:3103; ... }
